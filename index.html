 <script type="text/babel">
 const { useState, useMemo, useEffect, useRef, useCallback } = React;

 // ==================== Animation utilities ====================

 // Animated number-counting hook
 const useCountUp = (end, duration = 2000, start = 0) => {
 const [count, setCount] = useState(start);
 const [isVisible, setIsVisible] = useState(false);
 const ref = useRef(null);

 useEffect(() => {
 const observer = new IntersectionObserver(
 ([entry]) => {
 if (entry.isIntersecting &&!isVisible) {
 setIsVisible(true);
 }
 },
 { threshold: 0.1 }
 );

 if (ref.current) {
 observer.observe(ref.current);
 }

 return () => observer.disconnect();
 }, [isVisible]);

 useEffect(() => {
 if (!isVisible) return;

 let startTime;
 const endValue = typeof end === 'string'? parseFloat(end.replace(/,/g, '')): end;

 if (isNaN(endValue)) {
 setCount(end);
 return;
 }

 const animate = (currentTime) => {
 if (!startTime) startTime = currentTime;
 const progress = Math.min((currentTime - startTime) / duration, 1);
 const easeOutQuart = 1 - Math.pow(1 - progress, 4);
 setCount(Math.floor(easeOutQuart * endValue));

 if (progress < 1) {
 requestAnimationFrame(animate);
 }
 };

 requestAnimationFrame(animate);
 }, [isVisible, end, duration]);

 return { count, ref };
 };

 // Scroll-triggered animation hook
 const useScrollAnimation = (threshold = 0.1) => {
 const [isVisible, setIsVisible] = useState(false);
 const ref = useRef(null);

 useEffect(() => {
 const observer = new IntersectionObserver(
 ([entry]) => {
 if (entry.isIntersecting) {
 setIsVisible(true);
 observer.unobserve(entry.target);
 }
 },
 { threshold }
 );

 if (ref.current) {
 observer.observe(ref.current);
 }

 return () => observer.disconnect();
 }, [threshold]);

 return { isVisible, ref };
 };

 // Staggered animation component
 const StaggeredAnimation = ({ children, staggerDelay = 100, className = '' }) => {
 const { isVisible, ref } = useScrollAnimation();

 return (
 <div ref={ref} className={className}>
 {React.Children.map(children, (child, index) => (
 <div
 style={{
 opacity: isVisible? 1: 0,
 transform: isVisible? 'translateY(0)': 'translateY(30px)',
 transition: `all 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${index * staggerDelay}ms`
 }}
 >
 {child}
 </div>
 ))}
 </div>
 );
 };

 // Numeric statistic-card component
 const AnimatedStatCard = ({ label, value, icon, delay = 0 }) => {
 const { count, ref } = useCountUp(value, 2000);
 const displayValue = typeof value === 'string' && isNaN(parseFloat(value.replace(/,/g, '')))? value: count.toLocaleString();

 return (
 <div
 ref={ref}
 className="rounded-2xl bg-white border border-emerald-700/30 p-5 card-hover shimmer glow-border"
 style={{
 animationDelay: `${delay}ms`,
 opacity: 0,
 animation: `bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) ${delay}ms forwards`
 }}
 >
 <div className="pulse-icon inline-block">
 <Icon name={icon} className="text-gray-800 mb-3" size={28} />
 </div>
 <div className="text-2xl font-bold text-gray-800 gradient-text">{displayValue}</div>
 <div className="text-gray-800 text-sm mt-1">{label}</div>
 </div>
 );
 };

 // Data-file base path relative to index.html
 const DATA_BASE_URL = './data';
 const PUBLIC_OMICS = window.LMDB_OMICS_CATALOG || { datasets: [], files: [], summary: {} };
 const publicOmicsForSpecies = (speciesId, omicsType) => (PUBLIC_OMICS.datasets || []).filter(dataset =>
 dataset.omicsType === omicsType && (dataset.speciesIds || []).includes(speciesId)
 );

 // ==================== Data export utilities ====================
 const downloadCSV = (data, filename) => {
 if (!data || data.length === 0) return;
 const headers = Object.keys(data[0]);
 const csvContent = [
 headers.join(','),...data.map(row => headers.map(h => {
 const val = row[h];
 if (typeof val === 'string' && (val.includes(',') || val.includes('"') || val.includes('\n'))) {
 return `"${val.replace(/"/g, '""')}"`;
 }
 return val?? '';
 }).join(','))
 ].join('\n');
 const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
 const link = document.createElement('a');
 link.href = URL.createObjectURL(blob);
 link.download = filename;
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);
 };

 const downloadJSON = (data, filename) => {
 const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
 const link = document.createElement('a');
 link.href = URL.createObjectURL(blob);
 link.download = filename;
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);
 };

 const downloadTSV = (data, filename) => {
 if (!data || data.length === 0) return;
 const headers = Object.keys(data[0]);
 const tsvContent = [
 headers.join('\t'),...data.map(row => headers.map(h => row[h]?? '').join('\t'))
 ].join('\n');
 const blob = new Blob([tsvContent], { type: 'text/tab-separated-values' });
 const link = document.createElement('a');
 link.href = URL.createObjectURL(blob);
 link.download = filename;
 document.body.appendChild(link);
 link.click();
 document.body.removeChild(link);
 };

 // ==================== DownloadButton component ====================
 const DownloadButtons = ({ data, filename, formats = ['csv', 'json'] }) => {
 if (!data || data.length === 0) return null;
 return (
 <div className="flex items-center gap-2 flex-wrap">
 <span className="text-gray-700 text-xs">Export:</span>
 {formats.includes('csv') && (
 <button onClick={() => downloadCSV(data, `${filename}.csv`)} className="download-btn px-3 py-1.5 rounded-lg bg-white text-gray-800 text-xs hover:bg-white flex items-center gap-1.5">
 <Icon name="file-spreadsheet" size={12} />CSV
 </button>
 )}
 {formats.includes('json') && (

 // ==================== Bar chart component ====================
 const BarChart = ({ data, labels, title, colors, horizontal = false }) => {
 const chartRef = useRef(null);
 const chartInstance = useRef(null);

 useEffect(() => {
 if (!chartRef.current ||!data || data.length === 0) return;

 if (chartInstance.current) {
 chartInstance.current.destroy();
 }

 const ctx = chartRef.current.getContext('2d');
 chartInstance.current = new Chart(ctx, {
 type: 'bar',
 data: {
 labels: labels,
 datasets: Array.isArray(data[0])? data.map((d, i) => ({
 label: d.label || `Dataset ${i+1}`,
 data: d.values || d,
 backgroundColor: colors?.[i] || `rgba(52, 211, 153, ${0.6 - i * 0.15})`,
 borderColor: colors?.[i]?.replace('0.6', '1') || 'rgba(52, 211, 153, 1)',
 borderWidth: 1,
 borderRadius: 4,
 })): [{
 label: title || 'Values',
 data: data,
 backgroundColor: colors || 'rgba(52, 211, 153, 0.6)',
 borderColor: 'rgba(52, 211, 153, 1)',
 borderWidth: 1,
 borderRadius: 4,
 }]
 },
 options: {
 indexAxis: horizontal? 'y': 'x',
 responsive: true,
 maintainAspectRatio: false,
 plugins: {
 legend: { display: Array.isArray(data[0]), labels: { color: '#374151' } },
 title: { display:!!title, text: title, color: '#1f2937', font: { size: 14 } }
 },
 scales: {
 x: { grid: { color: 'rgba(52, 211, 153, 0.1)' }, ticks: { color: '#374151' } },
 y: { grid: { color: 'rgba(52, 211, 153, 0.1)' }, ticks: { color: '#374151' } }
 }
 }
 });

 return () => { if (chartInstance.current) chartInstance.current.destroy(); };
 }, [data, labels, title, colors, horizontal]);

 return <canvas ref={chartRef} className="w-full h-full" />;
 };

 // ==================== Pie chart component ====================
 const PieChart = ({ data, labels, title, colors }) => {
 const chartRef = useRef(null);
 const chartInstance = useRef(null);

 useEffect(() => {

 if (chartInstance.current) chartInstance.current.destroy();

 const ctx = chartRef.current.getContext('2d');
 chartInstance.current = new Chart(ctx, {
 type: 'doughnut',
 data: {
 labels: labels,
 datasets: [{
 data: data,
 backgroundColor: colors || defaultColors.slice(0, data.length),
 borderColor: 'rgba(6, 35, 28, 0.8)',
 borderWidth: 2
 }]
 },
 options: {
 responsive: true,
 maintainAspectRatio: false,
 plugins: {
 legend: { position: 'right', labels: { color: '#374151', padding: 15 } },
 title: { display:!!title, text: title, color: '#1f2937', font: { size: 14 } }
 }
 }
 });

 return () => { if (chartInstance.current) chartInstance.current.destroy(); };
 }, [data, labels, title, colors]);

 return <canvas ref={chartRef} className="w-full h-full" />;

 // ==================== Line chart component ====================
 const LineChart = ({ datasets, labels, title }) => {
 const chartRef = useRef(null);
 const chartInstance = useRef(null);

 useEffect(() => {
 if (!chartRef.current ||!datasets || datasets.length === 0) return;

 if (chartInstance.current) chartInstance.current.destroy();

 const colors = ['#34d399', '#fbbf24', '#f97316', '#a855f7', '#3b82f6', '#ef4444'];

 const ctx = chartRef.current.getContext('2d');

 type: 'line',
 data: {
 labels: labels,
 datasets: datasets.map((ds, i) => ({
 label: ds.label,
 data: ds.data,
 borderColor: colors[i % colors.length],
 backgroundColor: colors[i % colors.length] + '20',
 fill: true,
 tension: 0.3,
 pointRadius: 4,
 pointHoverRadius: 6
 }))
 },
 options: {
 responsive: true,
 maintainAspectRatio: false,
 plugins: {
 legend: { labels: { color: '#374151' } },
 title: { display:!!title, text: title, color: '#1f2937', font: { size: 14 } }
 },
 scales: {
 x: { grid: { color: 'rgba(52, 211, 153, 0.1)' }, ticks: { color: '#374151' } },
 y: { grid: { color: 'rgba(52, 211, 153, 0.1)' }, ticks: { color: '#374151' } }
 }
 }
 });

 return () => { if (chartInstance.current) chartInstance.current.destroy(); };
 }, [datasets, labels, title]);

 return <canvas ref={chartRef} className="w-full h-full" />;
 };

 // Icon components using Lucide
 const Icon = ({ name, className = "", size = 20, style = {} }) => {
 const ref = React.useRef(null);
 React.useEffect(() => {
 if (ref.current && lucide.icons[name]) {
 ref.current.innerHTML = '';
 const icon = lucide.createElement(lucide.icons[name]);
 icon.setAttribute('width', size);
 icon.setAttribute('height', size);
 if (className) icon.setAttribute('class', className);
 Object.keys(style).forEach(key => {
 icon.style[key] = style[key];
 });
 ref.current.appendChild(icon);
 }
 }, [name, className, size, style]);
 return <span ref={ref} className="inline-flex items-center justify-center" />;
 };

 // simple sequence alignment algorithm
 const performAlignment = (query, subject) => {
 // clean sequence(remove spaces, line breaks, etc.)
 const cleanQuery = query.toUpperCase().replace(/[^ATCGN]/g, '');
 const cleanSubject = subject.toUpperCase().replace(/[^ATCGN]/g, '');

 // Foundbest alignment position(simple sliding window)
 let bestScore = 0;
 let bestPos = 0;
 const queryLen = cleanQuery.length;
 const subjectLen = cleanSubject.length;

 for (let i = 0; i <= subjectLen - queryLen; i++) {
 let score = 0;
 for (let j = 0; j < queryLen; j++) {
 if (cleanQuery[j] === cleanSubject[i + j]) {
 score++;
 }
 }
 if (score > bestScore) {
 bestScore = score;
 bestPos = i;
 }
 }

 // generate alignment results
 const alignedSubject = cleanSubject.slice(bestPos, bestPos + queryLen);
 let matchLine = '';
 let matches = 0;

 for (let i = 0; i < queryLen; i++) {
 if (cleanQuery[i] === alignedSubject[i]) {
 matchLine += '|';
 matches++;
 } else {
 matchLine += ' ';
 }
 }

 const identity = (matches / queryLen * 100).toFixed(1);
 const score = matches * 2; // simple scoring
 const evalue = Math.pow(10, -Math.floor(score / 5)).toExponential(0);

 return {
 query: cleanQuery,
 match: matchLine,
 subject: alignedSubject,
 queryStart: 1,
 queryEnd: queryLen,
 subjectStart: bestPos + 1,
 subjectEnd: bestPos + queryLen,
 identity: parseFloat(identity),
 score: score,
 evalue: evalue,
 alignLength: queryLen,
 matches: matches
 };
 };

 // protein sequence alignment algorithm
 const performProteinAlignment = (query, subject) => {
 const cleanQuery = query.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g, '');
 const cleanSubject = subject.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g, '');

 const getScore = (a, b) => {
 if (a === b) return 4;
 const similar = [['D', 'E'], ['K', 'R'], ['N', 'Q'], ['S', 'T'], ['F', 'Y', 'W'], ['I', 'L', 'V', 'M'], ['A', 'G']];
 for (var i = 0; i < similar.length; i++) {
 if (similar[i].includes(a) && similar[i].includes(b)) return 2;
 }
 return -1;
 };

 let bestScore = 0, bestPos = 0;
 const queryLen = cleanQuery.length, subjectLen = cleanSubject.length;

 for (let i = 0; i <= subjectLen - queryLen && i < subjectLen; i++) {
 let score = 0;
 for (let j = 0; j < queryLen && i + j < subjectLen; j++) {
 score += getScore(cleanQuery[j], cleanSubject[i + j]);
 }
 if (score > bestScore) { bestScore = score; bestPos = i; }
 }

 const alignLen = Math.min(queryLen, subjectLen - bestPos);
 const alignedSubject = cleanSubject.slice(bestPos, bestPos + alignLen);
 let matchLine = '', matches = 0, positives = 0;

 for (let i = 0; i < alignLen; i++) {
 if (cleanQuery[i] === alignedSubject[i]) { matchLine += cleanQuery[i]; matches++; positives++; }
 else if (getScore(cleanQuery[i], alignedSubject[i]) > 0) { matchLine += '+'; positives++; }
 else { matchLine += ' '; }
 }

 return {
 query: cleanQuery.slice(0, alignLen), match: matchLine, subject: alignedSubject,
 queryStart: 1, queryEnd: alignLen, subjectStart: bestPos + 1, subjectEnd: bestPos + alignLen,
 identity: parseFloat((matches / alignLen * 100).toFixed(1)),
 positive: parseFloat((positives / alignLen * 100).toFixed(1)),
 score: bestScore, evalue: Math.pow(10, -Math.floor(bestScore / 10)).toExponential(0),
 alignLength: alignLen, matches: matches, isProtein: true
 };
 };

 // run BLAST search - return Promise
 const runBlastSearch = (querySeq, species, evalueThreshold, blastType, maxHits, onProgress) => {
 blastType = blastType || 'blastn';
 maxHits = maxHits || 50;

 return new Promise(function(resolve, reject) {
 const isProteinQuery = blastType === 'blastp' || blastType === 'tblastn';
 const isProteinDb = blastType === 'blastp' || blastType === 'blastx';
 const dbType = isProteinDb? 'protein': 'cds';

 // get database path
 const dbPath = sequenceDbPaths[species] && sequenceDbPaths[species][dbType];
 const cacheKey = species + '_' + dbType;

 // try loading external database
 const doSearch = function(refs) {
 if (!refs || Object.keys(refs).length === 0) {
 refs = referenceSequences[species];
 }
 if (!refs) { resolve([]); return; }

 // clean query sequence
 const lines = querySeq.split('\n');
 let cleanQuery = '';
 for (var i = 0; i < lines.length; i++) {
 if (!lines[i].startsWith('>')) cleanQuery += lines[i].trim();
 }
 cleanQuery = isProteinQuery? cleanQuery.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g, ''): cleanQuery.toUpperCase().replace(/[^ATCGN]/g, '');

 if (cleanQuery.length < 10) { resolve([]); return; }

 const results = [];
 const cfg = speciesConfig[species];
 const entries = Object.entries(refs);
 const totalGenes = entries.length;

 for (var i = 0; i < entries.length; i++) {
 const geneId = entries[i][0];
 const geneData = entries[i][1];

 if (onProgress && i % 500 === 0) {
 onProgress('Aligning... ' + i + '/' + totalGenes);
 }

 const alignment = (isProteinQuery || isProteinDb)? performProteinAlignment(cleanQuery, geneData.sequence): performAlignment(cleanQuery, geneData.sequence);

 const evalueNum = parseFloat(alignment.evalue);
 const thresholdNum = parseFloat(evalueThreshold);

 if (alignment.identity >= 30 && evalueNum <= thresholdNum) {
 results.push(Object.assign({
 hit: geneId,
 annotation: geneData.name + ' (' + cfg.fullName + ')'
 }, alignment));
 }

 if (results.length >= maxHits * 2) break;
 }

 results.sort(function(a, b) { return b.identity - a.identity; });
 resolve(results.slice(0, maxHits));
 };

 // check cache
 if (loadedSequenceDb[cacheKey]) {
 doSearch(loadedSequenceDb[cacheKey]);
 return;
 }

 // try loading external data
 if (dbPath) {
 if (onProgress) onProgress('Loading sequence database...');
 fetch(dbPath).then(function(response) {
 if (!response.ok) throw new Error('HTTP ' + response.status);
 return response.json();
 }).then(function(data) {
 loadedSequenceDb[cacheKey] = data;
 doSearch(data);
 }).catch(function(error) {
 console.warn('Failed to load external database; using demo data:', error);
 doSearch(referenceSequences[species]);
 });
 } else {
 doSearch(referenceSequences[species]);
 }
 });
 };

 // BLAST search tool
 function BlastTool() {
 const [sequence, setSequence] = useState('');
 const [blastProgram, setBlastProgram] = useState('blastn');
 const [database, setDatabase] = useState('nt');
 const [isSearching, setIsSearching] = useState(false);
 const [results, setResults] = useState(null);
 const [error, setError] = useState('');
 const [jobId, setJobId] = useState('');

 const exampleDNA = '>Liriodendron_query\nATGGCTAGCTCAGATCGATCGATCGATCGATCGATCGATCGATCGATCGATC\nGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGAATCGATCGAT';
 const exampleProtein = '>Liriodendron_protein\nMASSDRSIDIDIDIDIDIDIDIDIDIDDIDIDIDIDIDIDIDIDID';

 const handleNCBIBlast = async () => {
 if (!sequence.trim()) { setError('Please enter a query sequence'); return; }
 const cleanSeq = sequence.replace(/^>.*\n/gm, '').replace(/\s/g, '');
 if (cleanSeq.length < 10) { setError('Sequence is too short'); return; }

 setError('');
 setIsSearching(true);
 setResults(null);

 try {
 // submit BLAST job
 const putUrl = `https://blast.ncbi.nlm.nih.gov/blast/Blast.cgi?CMD=Put&PROGRAM=${blastProgram}&DATABASE=${database}&QUERY=${encodeURIComponent(sequence)}`;
 const putRes = await fetch(putUrl);
 const putText = await putRes.text();

 const ridMatch = putText.match(/RID = (\w+)/);
 if (!ridMatch) throw new Error('Failed to submit BLAST job');

 const rid = ridMatch[1];
 setJobId(rid);

 // poll for results
 let attempts = 0;
 const maxAttempts = 60;

 const checkStatus = async () => {
 const getUrl = `https://blast.ncbi.nlm.nih.gov/blast/Blast.cgi?CMD=Get&FORMAT_TYPE=JSON2_S&RID=${rid}`;
 const getRes = await fetch(getUrl);
 const getText = await getRes.text();

 if (getText.includes('Status=WAITING')) {
 attempts++;
 if (attempts < maxAttempts) {
 setTimeout(checkStatus, 5000);
 } else {
 setError('BLAST job timed out; please view results later on the NCBI website');
 setIsSearching(false);
 }
 } else if (getText.includes('Status=READY')) {
 try {
 const jsonMatch = getText.match(/\{[\s\S]*\}/);
 if (jsonMatch) {
 const data = JSON.parse(jsonMatch[0]);
 setResults(data);
 }
 } catch (e) {
 setResults({ rid: rid, message: 'Results are ready; click the link below to view the full results at NCBI' });
 }
 setIsSearching(false);
 } else if (getText.includes('Status=FAILED') || getText.includes('Status=UNKNOWN')) {
 setError('BLAST job failed');
 setIsSearching(false);
 } else {
 attempts++;
 if (attempts < maxAttempts) setTimeout(checkStatus, 5000);
 else { setIsSearching(false); setResults({ rid: rid, message: 'Please view the results at NCBI' }); }
 }
 };

 setTimeout(checkStatus, 3000);
 } catch (err) {
 setError('Submission failed: ' + err.message);
 setIsSearching(false);
 }
 };

 return (
 <div className="space-y-6">
 <div className="p-4 bg-blue-500/10 border border-blue-500/30 rounded-xl">
 <p className="text-gray-800 text-sm flex items-center gap-2">
 <Icon name="info" size={16} />
 This tool connects directly to NCBI BLAST to search for similar sequences in global nucleotide/protein databases
 </p>
 </div>

 <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
 <div className="lg:col-span-2">
 <label className="block text-gray-800 text-sm mb-2">Input sequence (FASTA format)</label>
 <textarea value={sequence} onChange={(e) => setSequence(e.target.value)} placeholder={">sequence_name\nATCGATCGATCG..."} className="w-full h-48 px-4 py-3 bg-white border border-emerald-700/50 rounded-xl text-gray-800 font-mono text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 resize-none" />
 <div className="mt-2 flex gap-4">
 <button onClick={() => setSequence(exampleDNA)} className="text-xs text-gray-800 hover:text-gray-800">Load DNA example</button>
 <button onClick={() => setSequence(exampleProtein)} className="text-xs text-gray-800 hover:text-gray-800">Load protein example</button>
 </div>
 </div>
 <div className="space-y-4">
 <div>
 <label className="block text-gray-800 text-sm mb-2">BLAST program</label>
 <select value={blastProgram} onChange={(e) => setBlastProgram(e.target.value)} className="w-full px-3 py-2 bg-white border border-emerald-700/50 rounded-lg text-gray-800 text-sm">
 <option value="blastn">BLASTN (Nucleotide→Nucleotide)</option>
 <option value="blastp">BLASTP (protein to protein)</option>
 <option value="blastx">BLASTX (nucleotide to protein)</option>
 <option value="tblastn">TBLASTN (protein to nucleotide)</option>
 </select>
 </div>
 <div>
 <label className="block text-gray-800 text-sm mb-2">database</label>
 <select value={database} onChange={(e) => setDatabase(e.target.value)} className="w-full px-3 py-2 bg-white border border-emerald-700/50 rounded-lg text-gray-800 text-sm">
 <option value="nt">nt (nucleotide collection)</option>
 <option value="nr">nr (protein collection)</option>
 <option value="refseq_rna">RefSeq RNA</option>
 <option value="refseq_protein">RefSeq Protein</option>
 <option value="swissprot">SwissProt</option>
 </select>
 </div>
 <button onClick={handleNCBIBlast} disabled={isSearching} className="w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-gray-800 rounded-xl font-medium transition-all flex items-center justify-center gap-2">
 {isSearching? (<><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div><span>Processing at NCBI...</span></>): (<><Icon name="search" size={18} /><span>Submit to NCBI BLAST</span></>)}
 </button>
 </div>
 </div>

 {error && <div className="p-4 bg-red-500/20 border border-red-500/50 rounded-xl text-red-600 text-sm">{error}</div>}

 {jobId && (
 <div className="p-4 bg-white border border-emerald-700/30 rounded-xl">

 <a href={`https://blast.ncbi.nlm.nih.gov/Blast.cgi?CMD=Get&RID=${jobId}`} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-gray-800 rounded-lg text-sm transition-all">
 <Icon name="external-link" size={16} />View full results at NCBI
 </a>
 </div>
 )}

 {results && results.BlastOutput2 && (
 <div className="space-y-4 animate-fade-in">
 <h3 className="text-gray-800 font-semibold flex items-center gap-2">
 <Icon name="list" className="text-gray-800" size={20} />BLAST results
 </h3>
 <div className="space-y-3 max-h-96 overflow-y-auto">
 {results.BlastOutput2?.[0]?.report?.results?.search?.hits?.slice(0, 20).map((hit, idx) => (
 <div key={idx} className="p-4 bg-white border border-emerald-700/30 rounded-xl">
 <h4 className="text-gray-800 font-medium text-sm mb-1">{hit.description?.[0]?.title || 'Unknown'}</h4>
 <p className="text-gray-700 text-xs mb-2">Accession: {hit.description?.[0]?.accession}</p>
 <div className="flex gap-4 text-xs">

 <span className="text-gray-800">Identity: {((hit.hsps?.[0]?.identity / hit.hsps?.[0]?.align_len) * 100).toFixed(1)}%</span>
 </div>
 </div>
 ))}
 </div>
 </div>
 )}
 </div>
 );
 }

 const handleZoom = (factor) => {
 const center = (viewStart + viewEnd) / 2;
 const newWidth = viewWidth * factor;
 setViewStart(Math.max(0, center - newWidth / 2));
 setViewEnd(Math.min(chrData.length, center + newWidth / 2));
 };

 setSelectedChr('Chr01');
 setViewStart(1000000);
 setViewEnd(6000000);
 setSelectedGene(null);
 }, [toolSpecies]);

 // heterosisAnalysis Tools
 function HeterosisTool() {
 const [selectedGene, setSelectedGene] = useState(null);
 const [sortBy, setSortBy] = useState('heterosis');
 const [filterCategory, setFilterCategory] = useState('all');
 const [searchQuery, setSearchQuery] = useState('');
 const [showChart, setShowChart] = useState(true);

 // heterosis
 const calculateHeterosis = (gene) => {
 const midParent = (gene.chinense + gene.tulipifera) / 2;
 const highParent = Math.max(gene.chinense, gene.tulipifera);
 const mph_2x = ((gene.hybrid_2x - midParent) / midParent * 100).toFixed(1); // mid-parent heterosis
 const hph_2x = ((gene.hybrid_2x - highParent) / highParent * 100).toFixed(1); // better-parent heterosis
 const mph_4x = ((gene.hybrid_4x - midParent) / midParent * 100).toFixed(1);
 const hph_4x = ((gene.hybrid_4x - highParent) / highParent * 100).toFixed(1);
 const ploidyEffect = ((gene.hybrid_4x - gene.hybrid_2x) / gene.hybrid_2x * 100).toFixed(1); // ploidyeffect
 return { midParent, highParent, mph_2x, hph_2x, mph_4x, hph_4x, ploidyEffect };
 };

 const categories = [...new Set(heterosisData.genes.map(g => g.category))];

 const processedGenes = heterosisData.genes.map(gene => ({...gene,...calculateHeterosis(gene)
 })).filter(g => {
 const matchCategory = filterCategory === 'all' || g.category === filterCategory;
 const matchSearch = searchQuery === '' ||
 g.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
 g.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
 g.category.toLowerCase().includes(searchQuery.toLowerCase());
 return matchCategory && matchSearch;
 }).sort((a, b) => {
 if (sortBy === 'heterosis') return parseFloat(b.hph_2x) - parseFloat(a.hph_2x);
 if (sortBy === 'ploidy') return parseFloat(b.ploidyEffect) - parseFloat(a.ploidyEffect);
 return a.name.localeCompare(b.name);
 });

 const getHeterosisType = (hph) => {
 const val = parseFloat(hph);
 if (val > 20) return { type: 'better-parent heterosis', color: 'text-gray-800 bg-green-500/20' };
 if (val > 0) return { type: 'better-parent heterosis', color: 'text-gray-800 bg-emerald-500/20' };
 if (val > -10) return { type: 'mid-parent heterosis', color: 'text-gray-800 bg-yellow-500/20' };
 return { type: 'negative heterosis', color: 'text-red-600 bg-red-500/20' };
 };

 // Preparing export data
 const exportData = processedGenes.map(g => ({

 mid_parent: g.midParent.toFixed(1), high_parent: g.highParent.toFixed(1),
 mph_2x: g.mph_2x, hph_2x: g.hph_2x, mph_4x: g.mph_4x, hph_4x: g.hph_4x,
 ploidy_effect: g.ploidyEffect, heterosis_type: getHeterosisType(g.hph_2x).type
 }));

 // statisticstypeused for
 const heterosisTypeCounts = processedGenes.reduce((acc, g) => {
 const type = getHeterosisType(g.hph_2x).type;
 acc[type] = (acc[type] || 0) + 1;
 return acc;
 }, {});

 return (
 <div className="space-y-6">
 <div className="bg-gradient-to-r from-emerald-800/40 to-teal-800/40 border border-emerald-700/30 rounded-xl p-4">
 <h3 className="text-gray-800 font-semibold mb-2 flex items-center gap-2">
 <Icon name="trending-up" className="text-gray-800" size={20} />
 heterosis - Heterosis Analysis

 const data = coexpressionData.chinense;
 const modules = data.modules;

 const filteredNodes = data.nodes.filter(n => {
 if (selectedModule!== 'all' && n.module!== selectedModule) return false;
 if (showHubOnly &&!n.hub) return false;
 if (searchQuery!== '') {
 const match = n.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
 n.name.toLowerCase().includes(searchQuery.toLowerCase());
 if (!match) return false;
 }
 return true;
 });

 const filteredEdges = data.edges.filter(e => {
 const sourceNode = data.nodes.find(n => n.id === e.source);
 const targetNode = data.nodes.find(n => n.id === e.target);
 if (selectedModule!== 'all') {
 return sourceNode?.module === selectedModule || targetNode?.module === selectedModule;
 }
 return true;
 });

 // of demo
 const getNodePosition = (node, index) => {
 const moduleIndex = Object.keys(modules).indexOf(node.module);
 const angleOffset = moduleIndex * (Math.PI / 2);
 const radius = node.hub? 100: 150 + Math.random() * 50;
 const angle = angleOffset + (index * 0.5);
 return {
 x: 200 + Math.cos(angle) * radius,
 y: 200 + Math.sin(angle) * radius
 };
 };

 const nodePositions = {};
 filteredNodes.forEach((node, i) => {
 nodePositions[node.id] = getNodePosition(node, i);
 });

 gene_id: n.id, gene_name: n.name, module: modules[n.module]?.name || n.module,

 }));

 // ==================== AI Assistantcomponent ====================
 function AIAssistantTool() {
 const [messages, setMessages] = useState([]);
 const [inputValue, setInputValue] = useState('');
 const [isLoading, setIsLoading] = useState(false);
 const [serverOnline, setServerOnline] = useState(null); // null=checking, true, false
 const [selectedSpecies, setSelectedSpecies] = useState('chinense');
 const DEEPSEEK_KEY_STORAGE = 'lmdb_deepseek_api_key';
 const [apiKeyInput, setApiKeyInput] = useState(() => localStorage.getItem(DEEPSEEK_KEY_STORAGE) || '');
 const [apiKeySaved, setApiKeySaved] = useState(() => Boolean(localStorage.getItem(DEEPSEEK_KEY_STORAGE)));
 const messagesEndRef = useRef(null);

 // ── API config ──────────────────────────────────────────────────────
 const API_URL = 'https://api.deepseek.com/chat/completions';
 const MODEL = 'deepseek-v4-flash';
 // Genome sequence API. Disabled by default: the public build has no backend,
 // and an https:// page cannot reach http://localhost (blocked as mixed content).
 // To enable, set window.LMDB_GENOME_API = 'https://your-host/api' before this script.
 const GEN_SRV = (typeof window !== 'undefined' && window.LMDB_GENOME_API) || null;

 const saveDeepSeekKey = () => {
 const key = apiKeyInput.trim();
 if (!key) return;
 localStorage.setItem(DEEPSEEK_KEY_STORAGE, key);
 setApiKeySaved(true);
 };

 const clearDeepSeekKey = () => {
 localStorage.removeItem(DEEPSEEK_KEY_STORAGE);
 setApiKeyInput('');
 setApiKeySaved(false);
 };

 // ── Check genome server on mount ────────────────────────────────────
 useEffect(() => {
 if (!GEN_SRV) { setServerOnline(false); return; }
 const check = async () => {
 try {
 const r = await fetch(`${GEN_SRV}/ping`, {
 signal: AbortSignal.timeout(3000)
 });
 const d = await r.json();
 setServerOnline(d.status === 'ok');
 } catch (e) {
 setServerOnline(false);
 }
 };
 check();
 }, []);

 // ── Scroll to bottom ────────────────────────────────────────────────
 const scrollToBottom = () => {
 messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
 };
 useEffect(() => { scrollToBottom(); }, [messages]);

 // ── Extract gene IDs from user text ─────────────────────────────────
 const extractGeneIds = (text) => {
 const m1 = text.match(/Lchi\d+/gi) || [];
 const m2 = (text.match(/Litul\.[A-Za-z0-9]+(?:\.[0-9]+)?/gi)) || [];
 return [...new Set([...m1,...m2])];
 };

 // ── Detect which sequence types user wants ───────────────────────────
 const detectSeqTypes = (text) => {
 const t = text.toLowerCase();
 const types = ['gene_info'];
 if (t.match(/cds||coding|exon|exon/)) types.push('cds');
 if (t.match(/protein|protein||amino||peptide/)) types.push('protein');
 if (t.match(/promoter|promoter||upstream|5.*utr/)) types.push('promoter');
 if (t.match(/|downstream|3.*utr/)) types.push('downstream');
 // default: return all if only gene_info
 if (types.length === 1) { types.push('cds', 'protein', 'promoter'); }
 return types;
 };

 // ── Fetch gene data from genome server ──────────────────────────────
 const fetchGeneData = async (geneId, species, types) => {
 const url = `${GEN_SRV}/gene?id=${encodeURIComponent(geneId)}&species=${species}&types=${types.join(',')}`;
 const r = await fetch(url, { signal: AbortSignal.timeout(60000) });
 return await r.json();
 };

 // ── Format server response as readable context ───────────────────────
 // Server returns: { gene_id, species, found, data: { gene_info, cds, protein, promoter } }
 const formatGeneContext = (geneId, resp) => {
 if (!resp || resp.error) return `[${geneId}: databasemediumnot foundgene]\n`;
 if (!resp.found) return `[${geneId}: not found in the genome databaseFound]\n`;
 const data = resp.data || {};
 let ctx = `## gene ${geneId} of genomeinformation\n`;
 if (data.gene_info) {
 const g = data.gene_info;
 ctx += `- Chromosomes/Scaffold: ${g.chromosome}\n`;
 ctx += `- position: ${g.start}–${g.end} (${g.strand} )\n`;
 ctx += `- genelength: ${g.gene_length? g.gene_length.toLocaleString(): (g.end - g.start + 1).toLocaleString()} bp\n`;
 if (g.cds_exons) ctx += `- CDSexon: ${g.cds_exons}\n`;
 if (g.cds_coords && g.cds_coords.length) {
 ctx += `- CDScoordinate: ${g.cds_coords.slice(0,5).map(([s,e]) => s+'-'+e).join(', ')}${g.cds_coords.length > 5? '...': ''}\n`;
 }
 }
 if (data.cds) {
 const c = data.cds;
 ctx += `\n### CDSsequence (${c.full_length || c.length} bp${c.truncated? ', truncated3000bp': ''})\n`;
 ctx += '```\n' + c.sequence + '\n```\n';
 }
 if (data.protein) {
 const p = data.protein;
 ctx += `\n### proteinsequence (${p.full_length || p.length} aa${p.truncated? ', truncated': ''})\n`;
 ctx += '```\n' + p.sequence + '\n```\n';
 }
 if (data.promoter) {
 const pr = data.promoter;
 ctx += `\n### promoter/upstream sequence (${pr.length} bp, region: ${pr.region || ''})\n`;
 ctx += `- notes: ${pr.note || '2000 bp'}\n`;
 ctx += '```\n' + pr.sequence + '\n```\n';
 }
 if (data.downstream) {
 const ds = data.downstream;
 ctx += `\n### downstream sequence (${ds.length} bp)\n`;
 ctx += '```\n' + ds.sequence + '\n```\n';
 }
 return ctx;
 };

 // ── Build dynamic system prompt ─────────────────────────────────────
 const buildSystemPrompt = async (userText) => {
 const basePrompt = `Liriodendrondatabase(LMDB) of AI Assistant, also has direct genome-data reading capability. Please answer user questions in a professional and friendly tone. 

Database overview: 
- name: Liriodendron Multi-omics Database (LMDB) v3.1
- Species Covered: Liriodendron chinense(L. chinense), Liriodendron tulipifera(L. tulipifera), Hybrid Liriodendron2xand4x
- Data Types: genomics, transcriptomics, resequencing, miRNA, proteomics, metabolomics, epigenomics

Main functional modules: 
1. BLASTSearch - sequencealignment
2. primer design - supportsqPCR, cloning primer design
3. genome browser - visualizationgenomeannotation
4. geneExpressionQuery - 8tissue of Expression
5. SNP/InDelQuery - population genetic variation analysis
6. miRNATarget Geneprediction
7. gene
8. GO/KEGGenrichment analysis
9. heterosis
10. Expressionnetwork analysis

You are connected to the local genome database service, real gene sequence data can be provided directly(CDS, proteinsequence, promoter sequenceetc.). `;

 const geneIds = extractGeneIds(userText);
 if (!geneIds.length ||!serverOnline) return basePrompt;

 const seqTypes = detectSeqTypes(userText);
 const species = userText.match(/tulipifera|North America/i)? 'tulipifera': selectedSpecies;
 let geneContext = '\n\n---\n## byfromgenomedatabaseQuery of Real Data: \n';

 for (const gid of geneIds.slice(0, 3)) {
 try {
 const data = await fetchGeneData(gid, species, seqTypes);
 geneContext += formatGeneContext(gid, data);
 } catch (e) {
 geneContext += `[${gid}: Queryfailed - ${e.message}]\n`;
 }
 }
 geneContext += '\n---\nbyReal Datauser questions. userrequiressequence, of information. ';
 return basePrompt + geneContext;
 };

 // ── Render a single message ─────────────────────────────────────────
 const renderMessage = (content) => {
 // Convert markdown-ish to HTML
 const lines = content.split('\n');
 return lines.map((line, i) => {
 if (line.startsWith('### ')) return React.createElement('div', { key: i, className: 'font-bold text-emerald-700 mt-2 mb-1', children: line.slice(4) });
 if (line.startsWith('## ')) return React.createElement('div', { key: i, className: 'font-bold text-emerald-800 mt-3 mb-1 border-b border-emerald-200 pb-1', children: line.slice(3) });
 if (line.startsWith('- ')) return React.createElement('div', { key: i, className: 'text-gray-700 pl-3', children: '• ' + line.slice(2) });
 if (line.startsWith('```')) return null;
 if (line.match(/^[ACGT]{20,}$/) || line.match(/^[ACDEFGHIKLMNPQRSTVWY]{10,}$/)) {
 return React.createElement('div', { key: i, className: 'font-mono text-xs bg-gray-100 rounded px-2 py-0.5 my-0.5 text-gray-700 break-all', children: line });

 const userMessage = { role: 'user', content: text };
 setMessages(prev => [...prev, userMessage]);
 setInputValue('');
 setIsLoading(true);

 try {
 const storedKey = (localStorage.getItem(DEEPSEEK_KEY_STORAGE) || apiKeyInput).trim();

 }]);
 setIsLoading(false);
 return;
 }
 const systemPromptText = await buildSystemPrompt(text);
 const response = await fetch(API_URL, {
 method: 'POST',
 headers: {
 'Content-Type': 'application/json',
 'Authorization': `Bearer ${storedKey}`
 },
 body: JSON.stringify({
 model: MODEL,
 messages: [
 { role: 'system', content: systemPromptText },...messages.slice(-8).map(m => ({ role: m.role, content: m.content })),
 userMessage
 ],
 max_tokens: 2048,

 })
 });
 const data = await response.json().catch(() => ({}));

 setMessages(prev => [...prev, assistantMessage]);
 } catch (error) {
 console.error('API Error:', error);
 setMessages(prev => [...prev, {
 role: 'assistant',
 content: `**Query**: ${error.message}\n\n DeepSeek API Key, networkorbrowserCORSlimitation. GitHub Pages bybrowserCORS, requiresbackend proxyhide. `
 }]);
 } finally {
 setIsLoading(false);
 }
 };

 function loadNCBISamplesFromJSON() {
 // The complete 682-run catalog is embedded for static GitHub Pages use.
 window.ncbiSamplesData = NCBI_SAMPLES_DATA;
 window.ncbiSamplesFiltered = window.ncbiSamplesData;
 if (document.getElementById('ncbiStrategyFilter') && window.filterNCBISamples) {

 // NCBI sample filtering
 window.filterNCBISamples = function(searchText) {
 if (!window.ncbiSamplesData) return;

 const search = searchText!== undefined? searchText:
 (document.getElementById('ncbiSampleSearch')?.value?.trim().toLowerCase() || '');
 const speciesFilter = document.getElementById('ncbiSpeciesFilter')?.value || 'all';
 const strategyFilter = document.getElementById('ncbiStrategyFilter')?.value || 'all';

 window.ncbiSamplesFiltered = window.ncbiSamplesData.filter(sample => {
 const matchSearch =!search ||
 sample.Run.toLowerCase().includes(search) ||
 sample.BioProject.toLowerCase().includes(search) ||
 sample.SampleName.toLowerCase().includes(search) ||
 (sample.ScientificName && sample.ScientificName.toLowerCase().includes(search));

 const matchSpecies = speciesFilter === 'all' || sample.ScientificName === speciesFilter;
 const matchStrategy = strategyFilter === 'all' ||
 (strategyFilter === 'TRANSCRIPTOME'? TRANSCRIPTOME_STRATEGIES.has(sample.LibraryStrategy): sample.LibraryStrategy === strategyFilter);

 return matchSearch && matchSpecies && matchStrategy;
 });

 renderNCBISamples(1);
 };

 // render NCBI sample table
 function renderNCBISamples(page = 1) {
 const tbody = document.getElementById('ncbiSamplesTableBody');
 const pagination = document.getElementById('ncbiSamplesPagination');
 if (!tbody ||!window.ncbiSamplesFiltered) return;

 const itemsPerPage = 20;
 const totalPages = Math.ceil(window.ncbiSamplesFiltered.length / itemsPerPage);
 const startIdx = (page - 1) * itemsPerPage;
 const endIdx = startIdx + itemsPerPage;
 const currentItems = window.ncbiSamplesFiltered.slice(startIdx, endIdx);

 if (currentItems.length === 0) {
 tbody.innerHTML = '<tr><td colSpan="7" class="text-center py-8 text-gray-700">No matching samples found</td></tr>';
 pagination.innerHTML = '';
 return;
 }

 tbody.innerHTML = currentItems.map(sample => {
 const speciesShort = sample.ScientificName.replace('Liriodendron ', 'L. ');
 const description = sample.Column_1 || '-';
 return `
 <tr class="border-b border-emerald-700/10 hover:bg-white transition-colors">
 <td class="py-3 px-3 font-mono text-gray-800 text-xs">
 <a href="https://www.ncbi.nlm.nih.gov/sra/${sample.Run}" target="_blank"
 class="hover:text-gray-800 hover:underline">${sample.Run}</a>
 </td>
 <td class="py-3 px-3 text-emerald-800 italic text-xs">${speciesShort}</td>
 <td class="py-3 px-3 text-gray-800 text-xs">${sample.SampleName}</td>
 <td class="py-3 px-3 text-xs">
 <span class="px-2 py-0.5 rounded text-xs ${
 sample.LibraryStrategy === 'RNA-Seq'? 'bg-purple-500/20 text-gray-800':
 sample.LibraryStrategy === 'WGS'? 'bg-blue-500/20 text-gray-800':
 'bg-emerald-500/20 text-gray-800'
 }">${sample.LibraryStrategy}</span>
 </td>
 <td class="py-3 px-3 font-mono text-gray-700 text-xs">
 <a href="https://www.ncbi.nlm.nih.gov/bioproject/${sample.BioProject}" target="_blank"
 class="hover:text-gray-800 hover:underline">${sample.BioProject}</a>
 </td>
 <td class="py-3 px-3 text-gray-700 text-xs" style="max-width: 200px;">
 <div class="truncate" title="${description}">${description}</div>
 </td>
 <td class="py-3 px-3">
 <a href="https://www.ncbi.nlm.nih.gov/sra/${sample.Run}" target="_blank"
 class="text-xs px-2 py-1 rounded bg-teal-600/40 text-gray-800 hover:bg-teal-600/60 transition-all inline-flex items-center gap-1">
 <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
 </svg>
 Download
 </a>
 </td>
 </tr>
 `;
 }).join('');

 // render pagination
 if (totalPages > 1) {
 const pages = [];
 const maxVisible = 7;
 let startPage = Math.max(1, page - Math.floor(maxVisible / 2));
 let endPage = Math.min(totalPages, startPage + maxVisible - 1);

 if (endPage - startPage < maxVisible - 1) {
 startPage = Math.max(1, endPage - maxVisible + 1);
 }

 if (page > 1) {
 pages.push(`<button onclick="renderNCBISamples(${page - 1})" class="px-3 py-1 rounded bg-white text-gray-800 hover:bg-emerald-700/60 transition-all text-sm">Previous</button>`);
 }

 if (startPage > 1) {
 pages.push(`<button onclick="renderNCBISamples(1)" class="px-3 py-1 rounded bg-white text-gray-800 hover:bg-emerald-700/60 transition-all text-sm">1</button>`);
 if (startPage > 2) pages.push(`<span class="px-2 text-gray-700">...</span>`);
 }

 for (let i = startPage; i <= endPage; i++) {
 pages.push(`<button onclick="renderNCBISamples(${i})" class="px-3 py-1 rounded ${i === page? 'bg-emerald-600 text-white': 'bg-white text-gray-800 hover:bg-emerald-700/60'} transition-all text-sm">${i}</button>`);
 }

 if (endPage < totalPages) {
 if (endPage < totalPages - 1) pages.push(`<span class="px-2 text-gray-700">...</span>`);
 pages.push(`<button onclick="renderNCBISamples(${totalPages})" class="px-3 py-1 rounded bg-white text-gray-800 hover:bg-emerald-700/60 transition-all text-sm">${totalPages}</button>`);
 }

 if (page < totalPages) {
 pages.push(`<button onclick="renderNCBISamples(${page + 1})" class="px-3 py-1 rounded bg-white text-gray-800 hover:bg-emerald-700/60 transition-all text-sm">Next</button>`);
 }

 pagination.innerHTML = pages.join('');
 } else {
 pagination.innerHTML = '';
 }
 }

 // PubMed search - enhanced version with all-year article queries and year filters
 window.searchLitPubMed = async function(startIndex = 0) {
 const query = document.getElementById('litPubmedInput')?.value?.trim() || 'Liriodendron';
 const yearFrom = document.getElementById('litPubmedYearFrom')?.value?.trim();
 const yearTo = document.getElementById('litPubmedYearTo')?.value?.trim();
 const resultsDiv = document.getElementById('litResultsArea');
 const retmax = 50; // load 50 records each time

 // build search query including year
 let searchQuery = query;
 if (yearFrom || yearTo) {
 const fromYear = yearFrom || '1900';
 const toYear = yearTo || new Date().getFullYear().toString();
 searchQuery += ` AND ${fromYear}:${toYear}[pdat]`;
 }

 if (startIndex === 0) {
 resultsDiv.innerHTML = '<div class="flex items-center justify-center gap-2 py-8"><div class="animate-spin w-5 h-5 border-2 border-emerald-400 border-t-transparent rounded-full"></div><span class="text-gray-800">SearchPubMed...</span></div>';
 } else {
 // show Load More prompt
 const loadMoreBtn = document.getElementById('pubmedLoadMore');
 if (loadMoreBtn) {
 loadMoreBtn.innerHTML = '<div class="animate-spin w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full"></div><span>Loading...</span>';
 }
 }

 try {
 // step 1: search for total count and ID list
 const searchRes = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(searchQuery)}&retmax=${retmax}&retstart=${startIndex}&sort=relevance&retmode=json`);
 const searchData = await searchRes.json();
 const ids = searchData.esearchresult?.idlist || [];
 const totalCount = parseInt(searchData.esearchresult?.count || 0);

 if (ids.length === 0 && startIndex === 0) {
 resultsDiv.innerHTML = '<div class="text-center py-8 text-gray-800">No related literature found</div>';
 return;
 }

 // step 2: fetch literature summary information
 const summaryRes = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${ids.join(',')}&retmode=json`);
 const summaryData = await summaryRes.json();
 const articles = ids.map(id => summaryData.result[id]).filter(a => a);

 // generate literature-list HTML
 const articlesHtml = articles.map(a =>
 '<div class="p-4 rounded-lg bg-white border border-emerald-700/30 hover:border-blue-500/50 cursor-pointer transition-all" onclick="window.showPubMedDetails(' + a.uid + ')">' +
 '<h4 class="text-gray-800 text-sm font-medium mb-2">' + (a.title || '') + '</h4>' +
 '<p class="text-gray-700 text-xs mb-2">' + (a.authors?.slice(0,3).map(x => x.name).join(', ') || '') + (a.authors?.length > 3? ' et al.': '') + '</p>' +
 '<div class="flex gap-2 text-xs flex-wrap">' +
 '<span class="px-2 py-0.5 bg-blue-500/20 text-gray-800 rounded">' + (a.source || '') + '</span>' +
 '<span class="text-gray-700">' + (a.pubdate || '') + '</span>' +
 '<span class="text-gray-700">PMID: ' + a.uid + '</span>' +
 '</div></div>'
 ).join('');

 if (startIndex === 0) {
 // first load: show title and results
 const yearInfo = (yearFrom || yearTo)?
 `<span class="text-gray-700 text-xs ml-2">(${yearFrom || '1900'} - ${yearTo || new Date().getFullYear()})</span>`: '';
 resultsDiv.innerHTML =
 '<div class="mb-4">' +
 '<h3 class="text-gray-800 font-semibold flex items-center gap-2">' +
 '<span class="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center text-gray-800">📚</span>' +
 'PubMed search results' + yearInfo +
 '</h3>' +
 '<p class="text-gray-700 text-sm mt-1">Found ' + totalCount.toLocaleString() + ' publications, showing 1-' + articles.length + '</p>' +
 '</div>' +
 '<div id="pubmedArticlesList" class="space-y-3">' + articlesHtml + '</div>' +
 (totalCount > retmax?
 '<div class="mt-4 text-center">' +
 '<button id="pubmedLoadMore" onclick="window.loadMorePubMed(' + retmax + ', ' + totalCount + ')" ' +
 'class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-gray-800 rounded-lg text-sm transition-all flex items-center gap-2 mx-auto">' +
 '<span>Load More Publications</span>' +
 '<span class="text-xs opacity-75">(and ' + (totalCount - retmax) + ' articles)</span>' +
 '</button></div>': '');
 } else {
 // append loaded results to the existing list
 const articlesList = document.getElementById('pubmedArticlesList');
 if (articlesList) {
 articlesList.innerHTML += articlesHtml;
 }

 const loadedCount = startIndex + articles.length;
 const headerText = document.querySelector('#litResultsArea p');
 if (headerText) {
 headerText.textContent = 'Found ' + totalCount.toLocaleString() + ' publications, showing 1-' + loadedCount;
 }

 // Update or Remove"Load More"Button
 const loadMoreBtn = document.getElementById('pubmedLoadMore');
 if (loadMoreBtn) {
 if (loadedCount < totalCount) {
 loadMoreBtn.outerHTML =
 '<button id="pubmedLoadMore" onclick="window.loadMorePubMed(' + loadedCount + ', ' + totalCount + ')" ' +
 'class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-gray-800 rounded-lg text-sm transition-all flex items-center gap-2 mx-auto">' +
 '<span>Load More Publications</span>' +
 '<span class="text-xs opacity-75">(and ' + (totalCount - loadedCount) + ' articles)</span>' +
 '</button>';
 } else {
 loadMoreBtn.outerHTML = '<p class="text-gray-700 text-sm">All publications loaded</p>';
 }
 }
 }

 } catch(e) {
 if (startIndex === 0) {
 resultsDiv.innerHTML = '<div class="text-center py-8 text-red-600">Search failed: ' + e.message + '</div>';
 } else {
 const loadMoreBtn = document.getElementById('pubmedLoadMore');
 if (loadMoreBtn) {
 loadMoreBtn.innerHTML = '<span>Loading Failed, click to retry</span>';
 }
 }
 }
 };

let gbifMap = null;

// ==================== tab switching ====================
window.showDistributionTab = function showDistributionTab(tab) {
 // update tab styles
 const tabGbif = document.getElementById('tab-gbif');
 const tabIdigbio = document.getElementById('tab-idigbio');

 if (tab === 'gbif') {
 tabGbif.style.borderColor = 'rgb(52, 211, 153)';
 tabGbif.style.color = 'rgb(167, 243, 208)';
 tabIdigbio.style.borderColor = 'transparent';
 tabIdigbio.style.color = 'rgba(167, 243, 208, 0.6)';

 }

 // switch panel

 document.getElementById('panel-idigbio').style.display = tab === 'idigbio'? 'block': 'none';
}

// ==================== GBIF API integration ====================
window.loadGBIFData = async function loadGBIFData() {
 const species = document.getElementById('gbifSpeciesInput').value.trim();
 const limit = parseInt(document.getElementById('gbifLimitInput').value);

 if (!species) {
 alert('Please enter a scientific name');
 return;
 }

 // show loading state
 document.getElementById('gbifLoading').style.display = 'block';
 document.getElementById('gbifError').style.display = 'none';
 document.getElementById('gbifSpeciesInfo').style.display = 'none';
 document.getElementById('gbifStats').style.display = 'none';
 document.getElementById('gbifMapContainer').style.display = 'none';

 try {
 // 1. get species information
 const speciesResponse = await fetch(
 `https://api.gbif.org/v1/species/match?name=${encodeURIComponent(species)}`
 );
 const speciesData = await speciesResponse.json();

 if (!speciesData.usageKey) {
 throw new Error('species information not found');
 }

 // show species information
 displayGBIFSpeciesInfo(speciesData);

 // 2. get distribution records
 const occurrenceResponse = await fetch(
 `https://api.gbif.org/v1/occurrence/search?taxonKey=${speciesData.usageKey}&hasCoordinate=true&limit=${limit}`
 );
 const occurrenceData = await occurrenceResponse.json();

 if (!occurrenceData.results || occurrenceData.results.length === 0) {
 throw new Error('distribution records not found');
 }

 // show statistics
 displayGBIFStats(occurrenceData);

 // show map
 displayGBIFMap(occurrenceData.results);

 // hide loading state
 document.getElementById('gbifLoading').style.display = 'none';

 } catch (error) {
 console.error('GBIF data loading failed:', error);
 document.getElementById('gbifLoading').style.display = 'none';
 document.getElementById('gbifError').style.display = 'block';
 document.getElementById('gbifErrorMessage').textContent = error.message || 'Loading failed. Please check your network connection or try again later.';
 }
}

 const info = `

 <div><span style="color: #1f2937; font-weight: 500;">Scientific name: </span>${data.scientificName || 'N/A'}</div>
 <div><span style="color: #1f2937; font-weight: 500;">taxonomic status: </span>${data.status || 'N/A'}</div>
 <div><span style="color: #1f2937; font-weight: 500;">taxonomic rank: </span>${data.rank || 'N/A'}</div>
 </div>
 <div style="display: flex; flex-direction: column; gap: 0.5rem;">

function displayGBIFStats(data) {
 const results = data.results || [];

 // count countries
 const countries = new Set(results.map(r => r.country).filter(Boolean));

 // count year range
 const years = results.map(r => r.year).filter(Boolean).sort((a, b) => a - b);
 const yearRange = years.length > 0? `${years[0]}-${years[years.length - 1]}`: 'N/A';

 // count data types
 const basisOfRecord = new Set(results.map(r => r.basisOfRecord).filter(Boolean));

 document.getElementById('gbifTotalCount').textContent = data.count?.toLocaleString() || results.length.toLocaleString();
 document.getElementById('gbifCountryCount').textContent = countries.size;
 document.getElementById('gbifYearRange').textContent = yearRange;
 document.getElementById('gbifBasisCount').textContent = basisOfRecord.size;

 document.getElementById('gbifStats').style.display = 'grid';
}

function displayGBIFMap(results) {
 // destroy existing map if present
 if (gbifMap) {
 gbifMap.remove();
 gbifMap = null;
 }

 // show map container
 document.getElementById('gbifMapContainer').style.display = 'block';

 // initialize map
 gbifMap = L.map('gbifMap').setView([20, 0], 2);

 // add map layer
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 attribution: '© OpenStreetMap contributors',
 maxZoom: 18
 }).addTo(gbifMap);

 // create marker cluster group
 gbifMarkers = L.markerClusterGroup({
 maxClusterRadius: 50,
 spiderfyOnMaxZoom: true,
 showCoverageOnHover: false
 });

 // add markers
 results.forEach(record => {
 if (record.decimalLatitude && record.decimalLongitude) {
 const marker = L.marker([record.decimalLatitude, record.decimalLongitude]);

 // create popup content
 const popupContent = `
 <div style="padding: 0.5rem;">
 <div style="font-weight: 700; color: #1f2937; margin-bottom: 0.5rem;">${record.scientificName || 'Unknown'}</div>
 ${record.locality? `<div style="font-size: 0.75rem; margin-bottom: 0.25rem;"><span style="color: #1f2937;">Location: </span>${record.locality}</div>`: ''}
 ${record.country? `<div style="font-size: 0.75rem; margin-bottom: 0.25rem;"><span style="color: #1f2937;">Country: </span>${record.country}</div>`: ''}
 ${record.stateProvince? `<div style="font-size: 0.75rem; margin-bottom: 0.25rem;"><span style="color: #1f2937;">Province/state: </span>${record.stateProvince}</div>`: ''}
 ${record.year? `<div style="font-size: 0.75rem; margin-bottom: 0.25rem;"><span style="color: #1f2937;">Year: </span>${record.year}</div>`: ''}
 ${record.institutionCode? `<div style="font-size: 0.75rem; margin-bottom: 0.25rem;"><span style="color: #1f2937;">Institution: </span>${record.institutionCode}</div>`: ''}
 ${record.basisOfRecord? `<div style="font-size: 0.75rem; margin-bottom: 0.25rem;"><span style="color: #1f2937;">Type: </span>${record.basisOfRecord}</div>`: ''}
 <div style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid rgba(6, 95, 70, 0.3);">
 <a href="https://www.gbif.org/occurrence/${record.key}" target="_blank" rel="noopener"
 style="font-size: 0.75rem; color: #1f2937;">
 View details in GBIF →
 </a>
 </div>
 </div>
 `;

 marker.bindPopup(popupContent);
 gbifMarkers.addLayer(marker);
 }
 });

 // add cluster group to map
 gbifMap.addLayer(gbifMarkers);

 // fit view to show all markers
 if (gbifMarkers.getLayers().length > 0) {
 gbifMap.fitBounds(gbifMarkers.getBounds(), { padding: [50, 50] });
 }
}

// ==================== iDigBio API integration ====================
window.loadiDigBioData = async function loadiDigBioData() {
 const species = document.getElementById('idigbioSpeciesInput').value.trim();
 const limit = parseInt(document.getElementById('idigbioLimitInput').value);

 if (!species) {
 alert('Please enter a scientific name');
 return;
 }

 // show loading state
 document.getElementById('idigbioLoading').style.display = 'block';
 document.getElementById('idigbioError').style.display = 'none';
 document.getElementById('idigbioStats').style.display = 'none';
 document.getElementById('idigbioGrid').style.display = 'none';

 try {
 // build query parameters
 const searchParams = {
 rq: {
 scientificname: species
 },
 limit: limit,
 offset: 0
 };

 // call iDigBio API
 const response = await fetch('https://search.idigbio.org/v2/search/records/', {
 method: 'POST',
 headers: {
 'Content-Type': 'application/json',
 },
 body: JSON.stringify(searchParams)
 });

 const data = await response.json();

 if (!data.items || data.items.length === 0) {
 throw new Error('No specimens found');
 }

 // show statistics
 displayiDigBioStats(data);

 // show specimen grid
 displayiDigBioGrid(data.items);

 // hide loading state
 document.getElementById('idigbioLoading').style.display = 'none';

 } catch (error) {
 console.error('iDigBio data loading failed:', error);
 document.getElementById('idigbioLoading').style.display = 'none';
 document.getElementById('idigbioError').style.display = 'block';
 document.getElementById('idigbioErrorMessage').textContent = error.message || 'Loading failed. Please check your network connection or try again later.';
 }
}

function displayiDigBioStats(data) {
 const items = data.items || [];

 // count institutions
 const institutions = new Set(items.map(item => item.indexTerms?.institutioncode).filter(Boolean));

 // count records with images
 const withImages = items.filter(item => item.indexTerms?.hasImage === true).length;

 // count georeferenced records
 const georeferenced = items.filter(item => item.indexTerms?.geopoint).length;

 document.getElementById('idigbioTotalCount').textContent = data.itemCount?.toLocaleString() || items.length.toLocaleString();
 document.getElementById('idigbioInstitutions').textContent = institutions.size;
 document.getElementById('idigbioImages').textContent = withImages;
 document.getElementById('idigbioGeoref').textContent = georeferenced;

 document.getElementById('idigbioStats').style.display = 'grid';
}

 </svg>

 `}

 <div style="padding: 1rem;">

 ${data.collector? `

 </div>

 <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem;">
 ${data.hasImage? '<span style="padding: 0.25rem 0.5rem; background: rgba(5, 150, 105, 0.25); color: #1f2937; border-radius: 0.25rem; font-size: 0.75rem;">📷 Has image</span>': ''}
 ${data.geopoint? '<span style="padding: 0.25rem 0.5rem; background: rgba(5, 150, 105, 0.25); color: #1f2937; border-radius: 0.25rem; font-size: 0.75rem;">📍 Georeferenced</span>': ''}
 </div>

 <a href="https://www.idigbio.org/portal/records/${item.uuid}"
 target="_blank" rel="noopener"
 style="display: block; width: 100%; padding: 0.5rem 1rem; background: rgba(5, 150, 105, 0.2); color: #1f2937; text-align: center; border-radius: 0.5rem; text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: all 0.3s;">

}
